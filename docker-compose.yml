services:
  db:
    image: postgres:16-alpine
    container_name: connectqr-db
    environment:
      POSTGRES_USER: connectqr
      POSTGRES_PASSWORD: connectqr
      POSTGRES_DB: connectqr
    ports:
      - "5432:5432"
    volumes:
      - connectqr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectqr -d connectqr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - connectqr-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: connectqr-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-connectqr-dev-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:8081
      - DATABASE_URL=postgres://connectqr:connectqr@db:5432/connectqr
      - DB_SYNCHRONIZE=true
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - connectqr-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connectqr-frontend
    ports:
      - "8081:8081"
    environment:
      - EXPO_NO_WATCH_CONTENT=true
      - REACT_NATIVE_MANUAL_DEVSERVER=1
    volumes:
      - .:/app
      - /app/node_modules
    command: npx expo start --web --port 8081
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - connectqr-net

networks:
  connectqr-net:
    driver: bridge

volumes:
  connectqr-db-data: